<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Zoom</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { font: 11px/1 ui-monospace, Menlo, monospace; color: #fff; }
  #panel { position: absolute; left: 12px; top: 40px; width: 25vw; display: flex; flex-direction: column; gap: 6px; }
  #panel[hidden], #show[hidden] { display: none; }
  .backing { background: rgba(0, 0, 0, 0.55); border: 1px solid #fff; }
  #map { position: relative; width: 100%; aspect-ratio: 16 / 9; cursor: crosshair; touch-action: none; }
  button { font: inherit; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; text-align: center; padding: 5px 8px; cursor: pointer; }
  #hide { width: 100%; }
  #show { position: absolute; left: 12px; top: 40px; }
  #gauge-row { display: flex; align-items: flex-end; gap: 8px; }
  #gauge { position: relative; width: 14px; height: 140px; cursor: ns-resize; touch-action: none; }
  #fill { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; pointer-events: none; }
  .fades { transition: opacity 250ms ease; }
  body.idle .fades { opacity: 0; }
  #zoom-label { letter-spacing: 0.08em; text-shadow: 0 0 3px #000; }
</style>
</head>
<body>
<div id="panel" class="fades">
  <div id="map" data-clickable></div>
  <button id="hide" class="backing" data-clickable>Zoom hide</button>
  <div id="gauge-row">
    <div id="gauge" class="backing" data-clickable><div id="fill"></div></div>
    <span id="zoom-label">1.0x</span>
  </div>
</div>
<button id="show" class="backing fades" data-clickable hidden>Zoom show</button>

<script>
  var MAX_ZOOM = 8;
  var WHEEL_RATIO = Math.pow(2, 0.25);
  var IDLE_MS = 2500;
  var idleTimer = null;
  var pointer = null;
  var zoom = 1;

  var panel = document.getElementById("panel");
  var showButton = document.getElementById("show");
  var map = document.getElementById("map");
  var gauge = document.getElementById("gauge");
  var fill = document.getElementById("fill");
  var zoomLabel = document.getElementById("zoom-label");

  /**
   * Clamp a number to the range from 0 to 1.
   */
  function unit(value) {
    return Math.min(1, Math.max(0, value));
  }

  /**
   * Draw the viewport rectangle, gauge fill and labels from the plugin state.
   */
  function applyState(data) {
    zoom = data.zoom;
    map.style.aspectRatio = String(data.aspect);
    fill.style.height = (Math.log(zoom) / Math.log(MAX_ZOOM)) * 100 + "%";
    zoomLabel.textContent = zoom.toFixed(1) + "x";
    panel.hidden = !data.panelVisible;
    showButton.hidden = data.panelVisible;
    reportLayout();
  }

  /**
   * Tell the plugin where the minimap box sits, so the shader draws the frame there.
   */
  function reportLayout() {
    var box = map.getBoundingClientRect();

    iina.postMessage("layout", {
      x: box.left,
      y: box.top,
      w: box.width,
      h: box.height,
      viewW: window.innerWidth,
      viewH: window.innerHeight,
    });
  }

  /**
   * Convert a pointer event inside an element to fractions of that element.
   */
  function fractions(element, event) {
    var box = element.getBoundingClientRect();

    return { x: unit((event.clientX - box.left) / box.width), y: unit((event.clientY - box.top) / box.height) };
  }

  /**
   * Make an element report pointer drags, with capture, to the handler.
   */
  function onDrag(element, handler) {
    var dragging = false;

    element.addEventListener("pointerdown", function (event) {
      dragging = true;
      element.setPointerCapture(event.pointerId);
      handler(event);
    });
    element.addEventListener("pointermove", function (event) {
      if (dragging) {
        handler(event);
      }
    });
    element.addEventListener("pointerup", function () { dragging = false; });
    element.addEventListener("pointercancel", function () { dragging = false; });
  }

  onDrag(map, function (event) {
    iina.postMessage("center", fractions(map, event));
  });

  onDrag(gauge, function (event) {
    var level = 1 - fractions(gauge, event).y;

    iina.postMessage("zoom", { zoom: Math.pow(MAX_ZOOM, level) });
  });

  map.addEventListener("wheel", function (event) {
    event.preventDefault();
    iina.postMessage("zoom", { zoom: event.deltaY < 0 ? zoom * WHEEL_RATIO : zoom / WHEEL_RATIO });
  }, { passive: false });

  document.getElementById("hide").addEventListener("click", function () {
    iina.postMessage("panel", { visible: false });
  });
  showButton.addEventListener("click", function () {
    iina.postMessage("panel", { visible: true });
  });

  /**
   * Show the fading controls and fade them again after the mouse rests.
   */
  function wake() {
    setIdle(false);
    clearTimeout(idleTimer);
    idleTimer = setTimeout(rest, IDLE_MS);
  }

  /**
   * Determine if the mouse is resting on the minimap, the gauge or a button.
   */
  function isPointerOnControls() {
    if (pointer === null || !document.querySelector(".fades:hover")) {
      return false;
    }

    var element = document.elementFromPoint(pointer.x, pointer.y);

    // :hover goes stale when the mouse leaves for plain video, which sends the page no events, so check IINA's last point too.
    return element !== null && element.closest("[data-clickable]") !== null;
  }

  /**
   * Fade the controls, unless the mouse is resting on one of them.
   */
  function rest() {
    if (isPointerOnControls()) {
      idleTimer = setTimeout(rest, IDLE_MS);

      return;
    }

    setIdle(true);
  }

  /**
   * Fade the controls in or out, and tell the plugin so the minimap picture follows.
   */
  function setIdle(idle) {
    if (document.body.classList.contains("idle") === idle) {
      return;
    }

    document.body.classList.toggle("idle", idle);
    iina.postMessage("idle", { idle: idle });
  }

  /**
   * Show the fading controls whenever the mouse moves over the video.
   */
  function watchPointer() {
    var hitTest = window.iina._hitTest;

    /**
     * Answer IINA's hit test, treating a new point as a mouse move.
     */
    function watchedHitTest(x, y) {
      if (pointer === null || pointer.x !== x || pointer.y !== y) {
        pointer = { x: x, y: y };
        wake();
      }

      return hitTest(x, y);
    }

    // IINA sends mousemove only over clickable elements, but asks its hit test about every mouse move over the video.
    Object.defineProperty(window.iina, "_hitTest", {
      configurable: true,
      get: function () { return watchedHitTest; },
      set: function (replacement) { hitTest = replacement; },
    });
  }

  watchPointer();

  iina.onMessage("state", function (data) {
    applyState(data);
    wake();
  });
  iina.onMessage("init", reportLayout);
  window.addEventListener("resize", reportLayout);
</script>
</body>
</html>
